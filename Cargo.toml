[package]
name = "lazypost"
version = "0.1.0"
edition = "2021"
description = "A keyboard-first HTTP client for the terminal with vim keybindings"

[dependencies]
ratatui = "0.30"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
base64 = "0.22"
arboard = { version = "3", default-features = false }
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
